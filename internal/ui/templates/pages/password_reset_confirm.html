{{ define "title" }}{{.Title}}{{ end }}

{{ define "main-area" }}
<section class="auth-panel auth-sheet">
  <header class="auth-panel__header">
    <h1 class="auth-panel__title">{{.Heading}}</h1>
    <p class="auth-panel__meta">{{.Helper}}</p>
  </header>

  {{if .Message}}
  <ui-alert variant="info"><p>{{.Message}}</p></ui-alert>
  {{end}}

  {{if .Error}}
  <ui-alert variant="danger"><p>{{.Error}}</p></ui-alert>
  {{end}}

  {{if .ShowForm}}
  <form class="auth-panel__form form" action="/password-reset/confirm" method="POST">
    <fieldset class="form__fieldset">
      <legend class="form__legend">Set New Password</legend>

      <input type="hidden" name="token" value="{{.Token}}">

      <div class="form__group form-group">
        <label class="form__label" for="password">New password</label>
        <div class="form__input-wrap">
          <input class="form__input" type="password" id="password" name="password" required autocomplete="new-password" data-password-input>
          <button type="button" class="btn btn--secondary btn--small form__password-toggle" data-password-toggle data-target="password">Show</button>
        </div>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="confirm_password">Confirm password</label>
        <div class="form__input-wrap">
          <input class="form__input" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" data-password-input>
          <button type="button" class="btn btn--secondary btn--small form__password-toggle" data-password-toggle data-target="confirm_password">Show</button>
        </div>
        <small class="form__hint">Use at least 8 characters. Keep this password unique.</small>
      </div>

      <button class="btn btn--full" type="submit">Reset password</button>
    </fieldset>
  </form>
  {{end}}
</section>
{{ end }}
