{{ define "title" }}Add Product{{ end }}

{{ define "main-area" }}
<section class="auth-panel auth-sheet">
  <h1 class="auth-panel__title">Add New Product</h1>
  <p class="auth-panel__meta">Fill in product details to publish a new catalog item.</p>

  <form action="/partner/products/add" method="POST" class="auth-panel__form form">
    <fieldset class="form__fieldset">
      <legend class="form__legend">Product Information</legend>

      <div class="form__group form-group">
        <label class="form__label" for="name">Product Name</label>
        <input class="form__input" type="text" id="name" name="name" placeholder="e.g. Wireless Bluetooth Speaker" required>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="description">Description</label>
        <textarea class="form__textarea" id="description" name="description" rows="5" placeholder="Describe product features and specifications" required></textarea>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="price">Price (USD)</label>
        <input class="form__input" type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="stock_quantity">Stock Quantity</label>
        <input class="form__input" type="number" id="stock_quantity" name="stock_quantity" min="0" placeholder="0" required>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="category">Category</label>
        <select class="form__select" id="category" name="category">
          <option value="">Select category</option>
          <option value="electronics">Electronics</option>
          <option value="clothing">Clothing</option>
          <option value="home">Home and Garden</option>
          <option value="sports">Sports and Outdoors</option>
          <option value="books">Books and Media</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="partner-actions">
        <button type="submit" class="btn">Add Product</button>
        <a href="/partner/dashboard" class="btn btn--secondary">Cancel</a>
      </div>
    </fieldset>
  </form>

  <div class="notice notice--info alert alert--info">
    <h4>Listing Tips</h4>
    <ul>
      <li>Use clear product names.</li>
      <li>Include critical specs and dimensions.</li>
      <li>Keep price and stock accurate.</li>
    </ul>
  </div>
</section>
{{ end }}
