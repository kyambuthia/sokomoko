{{ define "title" }}Login{{ end }}

{{ define "main-area" }}
<section class="auth-panel auth-sheet">
  <h1 class="auth-panel__title auth-sheet__title">Sign In</h1>
  <p class="auth-panel__meta auth-sheet__meta">Access your Sokomoko account.</p>

  {{if .Error}}
  <div class="notice notice--danger alert alert--danger"><p>{{.Error}}</p></div>
  {{end}}

  <form action="/login" method="POST" class="auth-panel__form form">
    <fieldset class="form__fieldset">
      <legend class="form__legend">Account Access</legend>

      <div class="form__group form-group">
        <label class="form__label" for="username">Username</label>
        <input class="form__input" type="text" id="username" name="username" value="{{.Username}}" placeholder="your username" required autofocus>
      </div>

      <div class="form__group form-group">
        <label class="form__label" for="password">Password</label>
        <input class="form__input" type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn--full">Sign In</button>
    </fieldset>
  </form>

  <p class="auth-panel__alt">No account yet? <a href="/signup">Create one</a>.</p>
  <p class="auth-panel__links"><a href="/password-reset/request">Forgot password?</a></p>
</section>
{{ end }}
