{{ define "title" }}Sign in · sokomoko{{ end }}
{{ define "layout" }}{{ template "auth-layout" . }}{{ end }}

{{ define "main-area" }}
<div class="auth stack">
  <h1>Sign in</h1>
  {{ template "notice" dict "Kind" "danger" "Text" .Error }}
  <form action="/login" method="POST" class="form">
    {{ if .CSRFToken }}<input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">{{ end }}
    {{ if .Next }}<input type="hidden" name="next" value="{{ .Next }}">{{ end }}
    <div class="field">
      <label class="label" for="username">Username or email</label>
      <input class="input" type="text" id="username" name="username" value="{{ .Username }}" required autofocus autocomplete="username" autocapitalize="none">
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <ui-password><input class="input" type="password" id="password" name="password" required autocomplete="current-password"></ui-password>
    </div>
    <button type="submit" class="btn btn-block">Sign in</button>
  </form>
  <p class="row-between small"><a href="/signup">Create account</a><a href="/password-reset/request">Forgot password?</a></p>
</div>
{{ end }}
