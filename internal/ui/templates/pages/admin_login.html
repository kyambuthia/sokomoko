{{ define "title" }}Admin Login{{ end }}

{{ define "header-area" }}
<div class="admin-top-bar" style="background: #333; color: white; padding: 10px 20px; text-align: center;">
    <span>Sokomoko Admin Portal</span>
</div>
{{ end }}

{{ define "main-area" }}
<div class="main-area" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="login-container"
        style="background: #f9f9f9; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 30px;">Admin Login</h2>
        <form action="/login" method="POST">
            <div style="margin-bottom: 20px;">
                <label for="username" style="display: block; margin-bottom: 5px;">Username</label>
                <input type="text" id="username" name="username" required
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 30px;">
                <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
                <input type="password" id="password" name="password" required
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button type="submit"
                style="width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Login
                to Admin</button>
        </form>
    </div>
</div>
{{ end }}
