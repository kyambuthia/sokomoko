{{ define "body_area" }}

{{ template "site_nav_area" }}

<div class="feed-header-area">
        <h2>Products Available</h2>
</div>

<div class="product-feed"> 
  {{ range .Products }}
        <div class="product-card-area">
                <h3>{{.Name}}</h3>
                <p>{{.Description}}</p>
                <p>Price: {{.Price}}</p>
        </div>
  {{ end }}
</div>

{{ template "footer_area" }}
{{ end }}
