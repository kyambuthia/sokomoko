{{ define "title" }}Legacy Index{{ end }}

{{ define "main-area" }}
<section class="catalog-page">
  <header class="catalog-page__intro">
    <h1 class="catalog-page__title">Products Available</h1>
    <p class="catalog-page__lead">Legacy page retained for compatibility.</p>
  </header>

  <div class="product-list product-grid">
  {{ range .Products }}
    <article class="product-tile product-card">
      <div class="product-tile__body product-card__content">
        <h3 class="product-tile__name product-card__title">{{.Name}}</h3>
        <p class="product-tile__description product-card__description">{{.Description}}</p>
        <p class="product-tile__price product-card__price">${{printf "%.2f" .Price}}</p>
      </div>
    </article>
  {{ end }}
  </div>
</section>
{{ end }}
