{{ define "root_template" }}
<!DOCTYPE html>
<html lang="en">
        <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <meta name="color-scheme" content="light dark">
                <script src='{{ asset "scripts/theme-init.js" }}'></script>
                <link rel="manifest" href='{{ asset "manifest.json" }}'>
                <title>{{ block "title" . }}Sokomoko{{end}}</title>
                <link rel="stylesheet" href='{{ asset "stylesheets/styles.css" }}'>
                <script src='{{ asset "scripts/main.js" }}' defer></script>
                <script src='{{ asset "scripts/components.js" }}' defer></script>
        </head>
        <body class="{{ block "body-class" . }}site site--storefront{{ end }}">
                <a class="skip-link" href="#main-content">Skip to content</a>
                <div class="site__header wrapper--header">
                        {{ block "header-area" . }}
                        {{ end }}
                </div>

                {{ block "nav-area" . }}
                {{ end }}

                <div class="site__main wrapper--main" id="main-content" tabindex="-1">
                        <div class="site__container container">
                                {{ block "main-area" . }}
                                {{ end }}
                        </div>
                </div>

                <div class="site__footer wrapper--footer">
                        <div class="site__container container">
                                {{ block "footer-area" . }}
                                {{ end }}
                        </div>
                </div>
        </body>
</html>
{{ end }}
