name: Deploy demo

# CI builds, smoke-tests, and saves an image on a trunk push. This workflow
# pushes that same image and rolls the demo onto its digest. A manual re-run
# of CI does not deploy. A queued run skips itself when a newer commit is
# already on trunk.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: asiliano
  DEPLOY_INSTANCE_ID: i-0bec90e7573e98d76

jobs:
  deploy:
    name: Push and roll out
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'trunk' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip when trunk has moved on
        id: gate
        run: |
          git fetch origin trunk
          if [ "$(git rev-parse origin/trunk)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "trunk has a newer commit; leaving the demo for that rollout."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the smoke-tested image
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v7
        with:
          name: sokomoko-image
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::139023234259:role/sokomoko-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sokomoko-demo-${{ github.event.workflow_run.run_id }}

      - name: Log in to Amazon ECR
        if: steps.gate.outputs.skip != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the smoke-tested image
        if: steps.gate.outputs.skip != 'true'
        id: image
        run: |
          set -euo pipefail
          docker load -i /tmp/sokomoko-image.tar.gz
          tag="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.event.workflow_run.head_sha }}"
          docker tag sokomoko:ci "$tag"
          docker push "$tag"
          digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${{ github.event.workflow_run.head_sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "reference=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Roll the demo onto the new digest
        if: steps.gate.outputs.skip != 'true'
        run: bash deploy/rollout-demo.sh "${{ steps.image.outputs.reference }}"

      - name: Check the public demo is this commit
        if: steps.gate.outputs.skip != 'true'
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 36); do
            rm -f /tmp/ready-body
            headers=$(curl -fsS -D - -o /tmp/ready-body https://asiliano.online/readyz || true)
            code=$(printf '%s\n' "$headers" | awk 'BEGIN {c=""} /^HTTP/ {c=$2} END {print c}')
            version=$(printf '%s\n' "$headers" | awk 'tolower($1)=="x-sokomoko-version:" {print $2}' | tr -d '\r')
            body=$(cat /tmp/ready-body 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$body" = "ready" ] && [ "$version" = "$EXPECTED" ]; then
              exit 0
            fi
            sleep 5
          done
          printf 'demo is not serving %s\n' "$EXPECTED" >&2
          printf '%s\n' "$headers" >&2
          exit 1
