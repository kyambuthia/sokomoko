name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan current files for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .

      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --log-opts=--all --redact --no-banner .

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sokomoko
          POSTGRES_PASSWORD: sokomoko
          POSTGRES_DB: sokomoko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokomoko -d sokomoko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOKOMOKO_TEST_DATABASE_URL: postgres://sokomoko:sokomoko@localhost:5432/sokomoko_test?sslmode=disable
      SOKOMOKO_REQUIRE_DB_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Go modules
        run: go mod download

      - name: Check shell syntax
        run: bash scripts/check-shell.sh

      - name: Check Go formatting
        run: bash scripts/go-format.sh --check

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet Go packages
        run: go vet ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Check JavaScript syntax
        run: for f in internal/ui/static/scripts/*.js internal/ui/static/scripts/ui/*.js; do node --check "$f" || exit 1; done

      - name: Run JavaScript component tests
        run: node --test tests/ui/*.test.mjs

      - name: Run Go tests
        run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t sokomoko:ci .

      - name: Smoke test production image and isolated restore
        run: bash scripts/smoke-image.sh sokomoko:ci

      - name: Validate production Compose configuration
        run: docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml config --quiet

      - name: Save the smoke-tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        run: docker save sokomoko:ci | gzip -1 > /tmp/sokomoko-image.tar.gz

      - name: Upload the smoke-tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        uses: actions/upload-artifact@v7
        with:
          name: sokomoko-image
          path: /tmp/sokomoko-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  chat-crypto:
    name: Browser encryption source and assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install matching WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.114 --locked

      - name: Verify protocol operations and formatting
        run: make chat-crypto-test

      - name: Verify embedded browser assets match source
        run: make chat-crypto-check
