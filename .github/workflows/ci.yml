name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sokomoko
          POSTGRES_PASSWORD: sokomoko
          POSTGRES_DB: sokomoko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokomoko -d sokomoko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOKOMOKO_TEST_DATABASE_URL: postgres://sokomoko:sokomoko@localhost:5432/sokomoko_test?sslmode=disable
      SOKOMOKO_REQUIRE_DB_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet Go packages
        run: go vet ./...

      - name: Check JavaScript syntax
        run: for f in internal/ui/static/scripts/*.js; do node --check "$f"; done

      - name: Run Go tests
        run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t sokomoko:ci .
