{{ define "body_area" }}

{{ template "header_area" }}

<div class="main-area">
    <div class="">
        <div class="card__media-area">
            <img src="./static/Images/product_tv.png" width=200 height=200 alt="television category image">
        </div>
        <div class="card__content-area">
            <p>television</p>
        </div>
        <div class="card__action-area">
            <img src="./static/Images/television-category-images.png" width=200 height=200 alt="category image">
        </div>
    </div>
    <!-- category-feed -->
    <div class="category-">
    </div>

    <div class="feed-header-area">
            <h2>Products Available</h2>
    </div>

    <div class="product-feed"> 
      {{ range . }}
            <div class="product-card-area">
                    <h3>{{.Name}}</h3>
                    <p>{{.Phonenumber}}</p>
            </div>
      {{ end }}
    </div>
</div>

{{ template "footer_area" }}
{{ end }}
