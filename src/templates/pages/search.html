{{ define "body_area" }}
        {{ template "site_nav_area" .}}
        <h2>Search Results</h2>
        <div class="product-feed"> 
          {{ range .Products }}
                <div class="product-card-area">
                        <h3>{{.Name}}</h3>
                        <p>{{.Description}}</p>
                        <p>Price: {{.Price}}</p>
                </div>
          {{ end }}
        </div>
	{{ template "footer_area" }}
{{ end }}
