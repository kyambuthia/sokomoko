services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokomoko_migrate
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      POSTGRES_DB: sokomoko
      POSTGRES_APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    networks: [application]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    depends_on:
      db:
        condition: service_healthy

  app:
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: ${SOKOMOKO_IMAGE:?Set SOKOMOKO_IMAGE to an image digest}
    command: [seed]
    profiles: [seed]
    restart: "no"
    env_file: .env.seed
    environment:
      ENV: development
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
      LOG_FORMAT: text
    networks: [application]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
