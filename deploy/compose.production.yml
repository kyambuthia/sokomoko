name: sokomoko

x-runtime: &runtime
  image: ${SOKOMOKO_IMAGE:?Set SOKOMOKO_IMAGE to a tested image digest}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  networks: [application]

services:
  migrate:
    <<: *runtime
    profiles: [release]
    command: [migrate]
    restart: "no"
    environment:
      ENV: production
      LOG_FORMAT: json
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the release database connection}

  app:
    <<: *runtime
    command: [serve]
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      ENV: production
      PORT: "8080"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Set the runtime database connection}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_QUERY_TIMEOUT_SECONDS: ${DB_QUERY_TIMEOUT_SECONDS:-10}
      ALLOWED_HOSTS: ${STOREFRONT_HOST:?Set the storefront hostname},${ADMIN_HOST:?Set the admin hostname},${PARTNER_HOST:?Set the operations hostname}
      TRUST_PROXY_HEADERS: "true"
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      PASSWORD_RESET_BASE_URL: https://${STOREFRONT_HOST}
      PUBLIC_BASE_URL: https://${STOREFRONT_HOST}
      SECRETS_KEY: ${SECRETS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for password recovery}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM for password recovery}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      POST_RATE_LIMIT_MAX: ${POST_RATE_LIMIT_MAX:-120}
      POST_RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_ABUSE_MAX_FAILURES: ${AUTH_ABUSE_MAX_FAILURES:-5}
      AUTH_ABUSE_BACKOFF_BASE_SECONDS: "1"
      AUTH_ABUSE_BACKOFF_MAX_SECONDS: "300"

  proxy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      STOREFRONT_HOST: ${STOREFRONT_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      PARTNER_HOST: ${PARTNER_HOST}
      TLS_EMAIL: ${TLS_EMAIL:?Set the certificate contact email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [application]
    security_opt: [no-new-privileges:true]

networks:
  application:

volumes:
  caddy_data:
  caddy_config:
